name: Update Global Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate stats block
        env:
          USERNAME: Ako-Didion
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq cloc

          AUTH_HEADER="Authorization: Bearer ${GITHUB_TOKEN}"

          # 1. Infos utilisateur & stats générales
          USER_JSON=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/users/${USERNAME}")
          FOLLOWERS=$(echo "$USER_JSON" | jq -r '.followers // 0')
          PUBLIC_REPOS=$(echo "$USER_JSON" | jq -r '.public_repos // 0')
          PUBLIC_GISTS=$(echo "$USER_JSON" | jq -r '.public_gists // 0')

          REPOS_JSON=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/users/${USERNAME}/repos?per_page=100&type=owner")
          TOTAL_STARS=$(echo "$REPOS_JSON" | jq '[.[].stargazers_count] | add // 0')

          # 2. Analyse des lignes de code via cloc
          mkdir -p /tmp/all_repos
          cd /tmp/all_repos

          REPO_URLS=$(echo "$REPOS_JSON" | jq -r '.[] | select(.fork == false) | .clone_url')
          for url in $REPO_URLS; do
            git clone --depth=1 --single-branch "$url" 2>/dev/null || true
          done

          cloc . --json --quiet \
            --exclude-dir=node_modules,vendor,.git,dist,build,target,coverage,out \
            --exclude-ext=lock,min.js,min.css \
            > /tmp/cloc.json || echo "{}" > /tmp/cloc.json

          # Tableau HTML des langages
          echo "<table><thead><tr><th>Langage</th><th align=\"right\">Lignes</th></tr></thead><tbody>" > /tmp/lang_table.md
          jq -r '
            to_entries
            | map(select(.key != "header" and .key != "SUM" and .key != "YAML" and .key != "JSON" and .key != "Markdown" and .key != "Text" and .key != "XML" and .key != "SVG"))
            | sort_by(.value.code) | reverse
            | .[:8][]
            | "<tr><td><b>" + .key + "</b></td><td align=\"right\">" + ((.value.code // 0)|tostring) + "</td></tr>"
          ' /tmp/cloc.json >> /tmp/lang_table.md
          echo "</tbody></table>" >> /tmp/lang_table.md

          # 3. Récupération des projets épinglés (GraphQL fiable via fichier)
          cat << 'EOF' > /tmp/query.graphql
          query {
            user(login: "Ako-Didion") {
              pinnedItems(first: 6, types: REPOSITORY) {
                nodes {
                  ... on Repository {
                    name
                    url
                    description
                    primaryLanguage {
                      name
                    }
                    repositoryTopics(first: 4) {
                      nodes {
                        topic {
                          name
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          EOF

          # Appel API avec token forcé
          gh api graphql --input /tmp/query.graphql > /tmp/pinned.json || cat /tmp/query.graphql

          echo "=== DEBUG GRAPHQL ==="
          cat /tmp/pinned.json
          echo "======================"

          # Mise en forme HTML pour la cellule du tableau
          jq -r '
            .data.user.pinnedItems.nodes[]? |
            .name as $name |
            .url as $url |
            (.description // "Pas de description") as $desc |
            (.primaryLanguage.name // "") as $lang |
            ([.repositoryTopics.nodes[].topic.name] | map("<code>" + . + "</code>") | join(" ")) as $topics |
            "<p>🔹 <b><a href=\"" + $url + "\">" + $name + "</a></b><br>" +
            "<sub>" + $desc + "</sub><br>" +
            (if $topics != "" then $topics else (if $lang != "" then "<code>" + $lang + "</code>" else "" end) end) + "</p>"
          ' /tmp/pinned.json > /tmp/pinned_block.md

          # 4. Badges de profil
          cat > /tmp/stats_block.md <<EOF
          <p align="center">
            <img src="https://img.shields.io/badge/Followers-${FOLLOWERS}-000000?style=for-the-badge&logo=github&logoColor=white" />
            <img src="https://img.shields.io/badge/Public_Repos-${PUBLIC_REPOS}-000000?style=for-the-badge&logo=git&logoColor=white" />
            <img src="https://img.shields.io/badge/Public_Gists-${PUBLIC_GISTS}-000000?style=for-the-badge&logo=github&logoColor=white" />
            <img src="https://img.shields.io/badge/Total_Stars-${TOTAL_STARS}-000000?style=for-the-badge&logo=readdotcv&logoColor=white" />
          </p>
          EOF

          cd "$GITHUB_WORKSPACE"

          # 5. Injection dans le README
          awk '
            BEGIN {inblock=0}
            /<!-- STATS:START -->/ {print; system("cat /tmp/stats_block.md"); inblock=1; next}
            /<!-- STATS:END -->/ {inblock=0; print; next}
            !inblock {print}
          ' README.md > README.tmp && mv README.tmp README.md

          awk '
            BEGIN {inblock=0}
            /<!-- PINNED:START -->/ {print; system("cat /tmp/pinned_block.md"); inblock=1; next}
            /<!-- PINNED:END -->/ {inblock=0; print; next}
            !inblock {print}
          ' README.md > README.tmp && mv README.tmp README.md

          awk '
            BEGIN {inblock=0}
            /<!-- LANG_LINES:START -->/ {print; system("cat /tmp/lang_table.md"); inblock=1; next}
            /<!-- LANG_LINES:END -->/ {inblock=0; print; next}
            !inblock {print}
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore(stats): update profile metrics" && git push)
