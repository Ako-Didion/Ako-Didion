name: Update Global Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats-update
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate stats block
        env:
          USERNAME: Ako-Didion
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq cloc

          AUTH_HEADER="Authorization: Bearer ${GITHUB_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          # Langages "non-code" a ignorer lors du choix du langage principal
          # (config, donnees, balisage, documentation... pas du vrai code source)
          NON_CODE_LANGS_JSON='["YAML","JSON","TOML","XML","INI","CSV","Text","Markdown","SVG","Properties","robots.txt","diff","reStructuredText","JSON5","YANG","Windows Resource File","MSBuild script","DOS Batch"]'

          # Petite fonction pour appeler l'API et échouer proprement en cas d'erreur HTTP
          gh_api() {
            local url="$1"
            local http_code
            http_code=$(curl -s -o /tmp/gh_response.json -w "%{http_code}" -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$url")
            if [ "$http_code" -ge 400 ]; then
              echo "Erreur API GitHub ($http_code) sur $url" >&2
              cat /tmp/gh_response.json >&2
              exit 1
            fi
            cat /tmp/gh_response.json
          }

          # 1. Infos utilisateur & stats generales
          USER_JSON=$(gh_api "https://api.github.com/users/${USERNAME}")
          FOLLOWERS=$(echo "$USER_JSON" | jq -r '.followers // 0')
          PUBLIC_REPOS=$(echo "$USER_JSON" | jq -r '.public_repos // 0')
          PUBLIC_GISTS=$(echo "$USER_JSON" | jq -r '.public_gists // 0')

          # Pagination pour ne pas sous-evaluer le total d'etoiles au-dela de 100 repos
          REPOS_JSON="[]"
          page=1
          while :; do
            PAGE_JSON=$(gh_api "https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&type=owner")
            COUNT=$(echo "$PAGE_JSON" | jq 'length')
            REPOS_JSON=$(jq -s '.[0] + .[1]' <(echo "$REPOS_JSON") <(echo "$PAGE_JSON"))
            [ "$COUNT" -lt 100 ] && break
            page=$((page + 1))
          done

          TOTAL_STARS=$(echo "$REPOS_JSON" | jq '[.[].stargazers_count] | add // 0')

          # 2. Projets recents
          > /tmp/pinned_block.md

          TOP_REPOS=$(echo "$REPOS_JSON" | jq -c '
            map(select(.fork == false and .name != "'"${USERNAME}"'"))
            | sort_by(.pushed_at) | reverse
            | .[:5][]
          ')

          # Echappe les caracteres speciaux HTML pour ne pas casser le README
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            NAME=$(echo "$repo" | jq -r '.name' | html_escape)
            HTML_URL=$(echo "$repo" | jq -r '.html_url')
            DESC=$(echo "$repo" | jq -r '.description // "Aucune description"' | html_escape)
            CLONE_URL=$(echo "$repo" | jq -r '.clone_url')

            TMP_DIR=$(mktemp -d)
            git clone --depth=1 --single-branch "$CLONE_URL" "$TMP_DIR" 2>/dev/null || true

            TOP_LANG=$(cloc "$TMP_DIR" --json --quiet \
              --exclude-dir=node_modules,vendor,.git,dist,build,target,coverage,out \
              --exclude-ext=lock,min.js,min.css 2>/dev/null | jq -r --argjson excl "$NON_CODE_LANGS_JSON" '
              to_entries
              | map(select(.key != "header" and .key != "SUM"))
              | map(select(($excl | index(.key)) | not))
              | sort_by(.value.code) | reverse
              | .[0] // empty
              | (.key | ascii_upcase | @uri) + "-" + ((.value.code // 0)|tostring) + "_LIGNES"
            ' 2>/dev/null || true)

            rm -rf "$TMP_DIR"

            if [ -n "$TOP_LANG" ]; then
              BADGE="<img align=\"right\" src=\"https://img.shields.io/badge/${TOP_LANG}-000000?style=for-the-badge&logoColor=white&labelColor=000000&color=000000\" alt=\"tech\" />"
            else
              # Repli : langage principal detecte par GitHub (linguist), deja fiable et sans fichiers de config
              DEFAULT_LANG=$(echo "$repo" | jq -r '.language // empty' | tr '[:lower:]' '[:upper:]' | jq -sRr '@uri')
              if [ -n "$DEFAULT_LANG" ]; then
                BADGE="<img align=\"right\" src=\"https://img.shields.io/badge/${DEFAULT_LANG}-000000?style=for-the-badge&logoColor=white&labelColor=000000&color=000000\" alt=\"tech\" />"
              else
                BADGE=""
              fi
            fi

            echo "<p>${BADGE}🔹 <b><a href=\"${HTML_URL}\">${NAME}</a></b><br><sub>${DESC}</sub></p>" >> /tmp/pinned_block.md
          done <<< "$TOP_REPOS"

          # 3. Badges des statistiques globales
          echo "<p align=\"center\"><img src=\"https://img.shields.io/badge/FOLLOWERS-${FOLLOWERS}-000000?style=for-the-badge&logo=github&logoColor=white&color=000000&labelColor=000000\" alt=\"Followers\" /> <img src=\"https://img.shields.io/badge/PUBLIC_REPOS-${PUBLIC_REPOS}-000000?style=for-the-badge&logo=git&logoColor=white&color=000000&labelColor=000000\" alt=\"Public Repos\" /><br><img src=\"https://img.shields.io/badge/PUBLIC_GISTS-${PUBLIC_GISTS}-000000?style=for-the-badge&logo=github&logoColor=white&color=000000&labelColor=000000\" alt=\"Public Gists\" /> <img src=\"https://img.shields.io/badge/TOTAL_STARS-${TOTAL_STARS}-000000?style=for-the-badge&logo=readdotcv&logoColor=white&color=000000&labelColor=000000\" alt=\"Total Stars\" /></p>" > /tmp/stats_block.md

          cd "$GITHUB_WORKSPACE"

          # 4. Injection propre dans le README.md
          replace_block() {
            local tag="$1"
            local file="$2"

            if ! grep -q "<!-- ${tag}:START -->" README.md; then
              echo "Attention : balise <!-- ${tag}:START --> introuvable dans README.md, bloc ${tag} non mis a jour" >&2
              return
            fi

            awk -v start="<!-- ${tag}:START -->" -v end="<!-- ${tag}:END -->" -v insert="$file" '
              $0 ~ start { print; system("cat " insert); inblock=1; next }
              $0 ~ end   { inblock=0; print; next }
              !inblock   { print }
            ' README.md > README.tmp && mv README.tmp README.md
          }

          replace_block "STATS" "/tmp/stats_block.md"
          replace_block "PINNED" "/tmp/pinned_block.md"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore(stats): update profile metrics" && git push)
